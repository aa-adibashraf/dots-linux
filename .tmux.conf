set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-a
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind o

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# Cycle windows left/right without prefix
bind -n C-S-h previous-window
bind -n C-S-l next-window


set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy" # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

set -g base-index 1 #start indexing windows at 1 instead of 0
set -g detach-on-destroy #dont exit tmux when closing session
set -g renumber-windows on
set -g set-clipboard on

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'


general.import = ["~/.config/omarchy/current/theme/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[terminal.shell]
program = "zsh"

[font]
normal = { family = "JetBrainsMonoNL Nerd Font Mono" }
bold = { family = "JetBrainsMonoNL Nerd Font Mono" }
italic = { family = "JetBrainsMonoNL Nerd Font Mono" }
size = 14

[window]
padding.x = 0
padding.y = 0
# dynamic_padding = true
decorations = "None"
opacity = 0.85

[colors]
primary = { background = "#121212", foreground = "#EAEAEA" }
cursor = { cursor = "#12B981", text = "#121212" }
selection = { background = "#333333", foreground = "#FFFFFF" }

[colors.normal]
black = "#333333"
red = "#B91C1C"
green = "#10B981"
yellow = "#F59E0B"
blue = "#3B82F6"
magenta = "#8D20B2"
cyan = "#1EA7A0"
white = "#BEBEBE"

[colors.bright]
black = "#8A8A8D"
red = "#DC2626"
green = "#059669"
yellow = "#EFBF04"
blue = "#3B82F6"
magenta = "#B027DE"
cyan = "#1EA7A0"
white = "#FFFFFF"

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  { key = "Return", mods = "Shift", chars = "\u001B\r" },
]
